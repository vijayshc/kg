ontology:
  file: ../ontology/banking.ttl
  include_unmapped_terms: false

janusgraph:
  url: ${JANUSGRAPH_URL}

runtime:
  batch_size: ${KG_BATCH_SIZE:-500}
  fail_on_missing_vertex: true

ingestion:
  mode: prod
  source_type: teradata

classes:
  - iri: https://example.com/ontology/bank#Customer
    source:
      table: EDW.customer_dim
      key_column: customer_id
    properties:
      - iri: https://example.com/ontology/bank#customerName
        source_column: EDW.customer_dim.customer_name
      - iri: https://example.com/ontology/bank#dateOfBirth
        source_column: EDW.customer_dim.date_of_birth
      - iri: https://example.com/ontology/bank#customerSegment
        source_column: EDW.customer_dim.customer_segment
      - iri: https://example.com/ontology/bank#riskRating
        source_column: EDW.customer_dim.risk_rating
      - iri: https://example.com/ontology/bank#kycStatus
        source_column: EDW.customer_dim.kyc_status
      - iri: https://example.com/ontology/bank#email
        source_column: EDW.customer_dim.email
      - iri: https://example.com/ontology/bank#city
        source_column: EDW.customer_address.city
      - iri: https://example.com/ontology/bank#state
        source_column: EDW.customer_address.state
      - iri: https://example.com/ontology/bank#country
        source_column: EDW.customer_address.country
      - iri: https://example.com/ontology/bank#postalCode
        source_column: EDW.customer_address.postal_code
      - iri: https://example.com/ontology/bank#mobilePhone
        source_column: EDW.customer_phone.mobile_phone

  - iri: https://example.com/ontology/bank#Branch
    source:
      table: EDW.branch_dim
      key_column: branch_id
    properties:
      - iri: https://example.com/ontology/bank#branchCode
        source_column: EDW.branch_dim.branch_code
      - iri: https://example.com/ontology/bank#branchName
        source_column: EDW.branch_dim.branch_name
      - iri: https://example.com/ontology/bank#city
        source_column: EDW.branch_dim.city
      - iri: https://example.com/ontology/bank#state
        source_column: EDW.branch_dim.state
      - iri: https://example.com/ontology/bank#region
        source_column: EDW.branch_dim.region

  - iri: https://example.com/ontology/bank#Employee
    source:
      table: EDW.employee_dim
      key_column: employee_id
    properties:
      - iri: https://example.com/ontology/bank#employeeName
        source_column: EDW.employee_dim.employee_name
      - iri: https://example.com/ontology/bank#role
        source_column: EDW.employee_dim.role
      - iri: https://example.com/ontology/bank#region
        source_column: EDW.employee_dim.region

  - iri: https://example.com/ontology/bank#Product
    source:
      table: EDW.product_dim
      key_column: product_id
    properties:
      - iri: https://example.com/ontology/bank#productCode
        source_column: EDW.product_dim.product_code
      - iri: https://example.com/ontology/bank#productName
        source_column: EDW.product_dim.product_name
      - iri: https://example.com/ontology/bank#productType
        source_column: EDW.product_dim.product_type
      - iri: https://example.com/ontology/bank#interestRate
        source_column: EDW.product_dim.interest_rate

  - iri: https://example.com/ontology/bank#Account
    source:
      table: EDW.account_dim
      key_column: account_id
    properties:
      - iri: https://example.com/ontology/bank#accountNumber
        source_column: EDW.account_dim.account_number
      - iri: https://example.com/ontology/bank#accountType
        source_column: EDW.account_dim.account_type
      - iri: https://example.com/ontology/bank#accountStatus
        source_column: EDW.account_dim.account_status
      - iri: https://example.com/ontology/bank#openDate
        source_column: EDW.account_dim.open_date
      - iri: https://example.com/ontology/bank#currentBalance
        source_column: EDW.account_dim.current_balance
      - iri: https://example.com/ontology/bank#currentBalance
        property_key: balanceSnapshot
        source_column: EDW.account_dim.current_balance
        cardinality: LIST
        meta_properties:
          - property_key: balanceRecordedAt
            source_column: EDW.account_dim.open_date
            data_type: Date
          - property_key: propertyOrigin
            constant_value: EDW.account_dim.current_balance
      - iri: https://example.com/ontology/bank#currencyCode
        source_column: EDW.account_dim.currency_code

  - iri: https://example.com/ontology/bank#Card
    source:
      table: EDW.card_dim
      key_column: card_id
    properties:
      - iri: https://example.com/ontology/bank#cardNumberMasked
        source_column: EDW.card_dim.card_number_masked
      - iri: https://example.com/ontology/bank#cardType
        source_column: EDW.card_dim.card_type
      - iri: https://example.com/ontology/bank#cardStatus
        source_column: EDW.card_dim.card_status
      - iri: https://example.com/ontology/bank#expiryDate
        source_column: EDW.card_dim.expiry_date

  - iri: https://example.com/ontology/bank#Loan
    source:
      table: EDW.loan_dim
      key_column: loan_id
    properties:
      - iri: https://example.com/ontology/bank#loanNumber
        source_column: EDW.loan_dim.loan_number
      - iri: https://example.com/ontology/bank#loanType
        source_column: EDW.loan_dim.loan_type
      - iri: https://example.com/ontology/bank#principalAmount
        source_column: EDW.loan_dim.principal_amount
      - iri: https://example.com/ontology/bank#outstandingAmount
        source_column: EDW.loan_dim.outstanding_amount
      - iri: https://example.com/ontology/bank#loanStatus
        source_column: EDW.loan_dim.loan_status

  - iri: https://example.com/ontology/bank#Transaction
    source:
      table: EDW.transaction_fact
      key_column: transaction_id
    properties:
      - iri: https://example.com/ontology/bank#transactionCode
        source_column: EDW.transaction_fact.transaction_code
      - iri: https://example.com/ontology/bank#transactionDate
        source_column: EDW.transaction_fact.transaction_date
      - iri: https://example.com/ontology/bank#transactionAmount
        source_column: EDW.transaction_fact.transaction_amount
      - iri: https://example.com/ontology/bank#channel
        source_column: EDW.transaction_fact.channel
      - iri: https://example.com/ontology/bank#transactionType
        source_column: EDW.transaction_fact.transaction_type
      - iri: https://example.com/ontology/bank#debitCredit
        source_column: EDW.transaction_fact.debit_credit

  - iri: https://example.com/ontology/bank#Beneficiary
    source:
      table: EDW.beneficiary
      key_column: beneficiary_id
    properties:
      - iri: https://example.com/ontology/bank#beneficiaryName
        source_column: EDW.beneficiary.beneficiary_name
      - iri: https://example.com/ontology/bank#bankName
        source_column: EDW.beneficiary.bank_name
      - iri: https://example.com/ontology/bank#beneficiaryAccount
        source_column: EDW.beneficiary.beneficiary_account

  - iri: https://example.com/ontology/bank#Alert
    source:
      table: EDW.alert_fact
      key_column: alert_id
    properties:
      - iri: https://example.com/ontology/bank#alertCode
        source_column: EDW.alert_fact.alert_code
      - iri: https://example.com/ontology/bank#alertType
        source_column: EDW.alert_fact.alert_type
      - iri: https://example.com/ontology/bank#severity
        source_column: EDW.alert_fact.severity
      - iri: https://example.com/ontology/bank#alertStatus
        source_column: EDW.alert_fact.alert_status
      - iri: https://example.com/ontology/bank#raisedAt
        source_column: EDW.alert_fact.raised_at

relationships:
  - iri: https://example.com/ontology/bank#ownsAccount
    source_class_iri: https://example.com/ontology/bank#Customer
    target_class_iri: https://example.com/ontology/bank#Account
    source:
      from_column: EDW.account_customer_bridge.customer_id
      to_column: EDW.account_customer_bridge.account_id
    properties:
      - iri: https://example.com/ontology/bank#relationshipType
        source_column: EDW.account_customer_bridge.relationship_type

  - iri: https://example.com/ontology/bank#issuedByBranch
    source_class_iri: https://example.com/ontology/bank#Account
    target_class_iri: https://example.com/ontology/bank#Branch
    source:
      from_column: EDW.account_dim.account_id
      to_column: EDW.account_dim.branch_id

  - iri: https://example.com/ontology/bank#managedByEmployee
    source_class_iri: https://example.com/ontology/bank#Account
    target_class_iri: https://example.com/ontology/bank#Employee
    source:
      from_column: EDW.account_dim.account_id
      to_column: EDW.account_dim.relationship_manager_id

  - iri: https://example.com/ontology/bank#belongsToProduct
    source_class_iri: https://example.com/ontology/bank#Account
    target_class_iri: https://example.com/ontology/bank#Product
    source:
      from_column: EDW.account_dim.account_id
      to_column: EDW.account_dim.product_id

  - iri: https://example.com/ontology/bank#worksAtBranch
    source_class_iri: https://example.com/ontology/bank#Employee
    target_class_iri: https://example.com/ontology/bank#Branch
    source:
      from_column: EDW.employee_dim.employee_id
      to_column: EDW.employee_dim.branch_id

  - iri: https://example.com/ontology/bank#hasCard
    source_class_iri: https://example.com/ontology/bank#Account
    target_class_iri: https://example.com/ontology/bank#Card
    source:
      from_column: EDW.card_dim.account_id
      to_column: EDW.card_dim.card_id

  - iri: https://example.com/ontology/bank#hasLoan
    source_class_iri: https://example.com/ontology/bank#Customer
    target_class_iri: https://example.com/ontology/bank#Loan
    source:
      from_column: EDW.loan_dim.customer_id
      to_column: EDW.loan_dim.loan_id

  - iri: https://example.com/ontology/bank#postedTransaction
    source_class_iri: https://example.com/ontology/bank#Account
    target_class_iri: https://example.com/ontology/bank#Transaction
    source:
      from_column: EDW.transaction_fact.account_id
      to_column: EDW.transaction_fact.transaction_id
    properties:
      - iri: https://example.com/ontology/bank#transactionDate
        property_key: transactionDateEdge
        source_column: EDW.transaction_fact.transaction_date
        data_type: Date
      - iri: https://example.com/ontology/bank#debitCredit
        source_column: EDW.transaction_fact.debit_credit
      - iri: https://example.com/ontology/bank#channel
        source_column: EDW.transaction_fact.channel

  - iri: https://example.com/ontology/bank#beneficiaryForAccount
    source_class_iri: https://example.com/ontology/bank#Account
    target_class_iri: https://example.com/ontology/bank#Beneficiary
    source:
      from_column: EDW.beneficiary.account_id
      to_column: EDW.beneficiary.beneficiary_id

  - iri: https://example.com/ontology/bank#hasAlert
    source_class_iri: https://example.com/ontology/bank#Account
    target_class_iri: https://example.com/ontology/bank#Alert
    source:
      from_column: EDW.alert_fact.account_id
      to_column: EDW.alert_fact.alert_id
